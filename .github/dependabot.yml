# The workflows name every action by commit, which is what makes a tag moved
# under them harmless - and what would leave them on old code for ever if
# nothing moved the pins. This opens a pull request when an action has a newer
# release; it touches nothing but .github/workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
