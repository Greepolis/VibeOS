# SPDX-License-Identifier: GPL-3.0-or-later
name: VibeOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibeos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timer-torture-negative-controls:
    name: Timer production mutation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build focused timer test with sanitizers
        run: |
          set -euo pipefail
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DVIBEOS_BUILD_TESTS=ON -DVIBEOS_BUILD_KERNEL_IMAGE=OFF \
            -DVIBEOS_ENABLE_TLS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan --parallel --target vibeos_timer_torture
      - name: Require all production mutations to turn the test red
        env:
          SABOTAGE_VERIFY: bash scripts/dev/verify-timer-torture.sh build-asan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: python3 scripts/dev/sabotage.py kernel/time/timer.c scripts/dev/cases/time-timer.txt build-asan

  linux-build-test:
    name: Linux ${{ matrix.compiler }} / ${{ matrix.build_type }}
    # Pinned, in every workflow, rather than ubuntu-latest: that label moves to
    # Ubuntu 26 from 2026-10-19, and with it clang, gcc, QEMU, OVMF and the
    # glibc the corpus copies from the host - every gate's toolchain at once,
    # on whichever day GitHub's rollout reaches a job. Moving is a decision,
    # made in its own commit with a run to compare against.
    runs-on: ubuntu-24.04
    # Ten minutes is the slowest job's normal run. Without a bound a hung step
    # holds the run for GitHub's six hours, as one did (2026-10-07).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Harden The Runner
        # Every outbound connection and process this job makes, recorded:
        # the jobs a pull request triggers run code somebody else wrote, and
        # what that code does is the one thing a scan of its text cannot
        # tell. Audit, not block, until a few runs say which endpoints are
        # this build's own (2026-11-05).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The audited TLS dependency is a submodule; Linux is where it gets
          # built and tested, so it has to be fetched here.
          submodules: recursive

      - name: Host Tests Under Sanitizers
        # The protocol code parses input an attacker controls, so the host
        # tests are also run with the address and undefined-behaviour
        # sanitizers. Cheap - it is the same tests, no emulation - and it is
        # the only gate that sees memory errors at all.
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVIBEOS_BUILD_TESTS=ON \
            -DVIBEOS_BUILD_KERNEL_IMAGE=OFF \
            -DVIBEOS_ENABLE_TLS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build-asan --output-on-failure

      # The packages below are 164 MB, fetched from Azure's Ubuntu mirror on
      # every run. On 2026-10-26 it served them at tens of KB/s - 35 MB of
      # mingw in over two minutes - and two jobs ran out of the step's fifteen
      # minutes with nothing wrong in the code. The .debs are kept between runs
      # instead, keyed by the list, so a slow mirror costs the first run only.
      - name: Restore Downloaded Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-24.04-${{ hashFiles('.github/workflows/cmake-multi-platform.yml') }}
          restore-keys: apt-${{ runner.os }}-24.04-

      - name: Install Dependencies
        # A mirror that stops answering held the clang Debug job here for six
        # hours, until GitHub cancelled the whole run (2026-10-07). It takes
        # under two minutes when it works.
        timeout-minutes: 15
        run: |
          # A stalled connection is dropped and retried rather than waited on.
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get $APT update
          # musl-tools builds the unmodified static Linux binary the boot gate
          # runs. Without it that check silently does not happen, which is the
          # kind of gap that turns a gate into decoration.
          # ntfs-3g, exfatprogs and mtools build the NTFS, exFAT and long-name FAT images the boot
          # mounts and the gate asserts; without them both report "no image".
          sudo apt-get $APT install -y qemu-system-x86 qemu-utils ninja-build build-essential clang ovmf xorriso musl-tools ntfs-3g exfatprogs mtools gcc-mingw-w64-x86-64
          # The cache action runs as the runner user; apt left these root's.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DVIBEOS_BUILD_TESTS=ON
          -DVIBEOS_BUILD_KERNEL_IMAGE=ON
          -DVIBEOS_REQUIRE_TLS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Host Tests
        run: ctest --test-dir build --output-on-failure

      # The repository's own checks - layering, user access, Linux layouts,
      # sabotage anchors, the checks on the checks. They ran only from a
      # developer's check.sh, so a change that broke one merged green (external
      # review, 2026-10-07). Same file check.sh calls; once, since none of them
      # depends on the compiler.
      - name: Repository Checks
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: bash scripts/dev/static-checks.sh build

      - name: Build Boot Artifacts
        run: cmake --build build --target vibeos_image

      # Both toolchains now produce a bootable image: GCC via ELF->objcopy PE,
      # Clang via a native LLD PE link. Boot-gate both.
      # Generous timeouts: GitHub runners emulate with TCG (no KVM), so OVMF
      # boot plus the on-metal bring-up demos are much slower than on a dev box.
      - name: QEMU OVMF Smoke (Required Gate)
        timeout-minutes: 6
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-smoke-ovmf-linux.sh
          ./scripts/qemu-smoke-ovmf-linux.sh build "BOOT_OK" 150

      # This one runs the guest with 4 vCPUs so the SMP path (AP startup, the
      # per-CPU LAPIC timers, the shared run queue) is actually exercised.
      # Four TCG cores are several times slower than one, hence the budget.
      - name: QEMU Boot-to-CLI Smoke (Required Gate)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-smoke-cli-linux.sh
          # The budget is generous on purpose: four TCG cores, a full shell
          # session and a TCP exchange, on a runner that also builds the TLS
          # dependency. A failure now reports whether the guest went quiet or
          # was still making progress, so an undersized budget is not mistaken
          # for a hang.
          ./scripts/qemu-smoke-cli-linux.sh build 900

      - name: Build Importable VM Images (esp.img/.vdi/.vmdk/.iso, GCC)
        if: matrix.compiler == 'gcc'
        run: |
          set -euo pipefail
          chmod +x scripts/make-vm-images-linux.sh
          ./scripts/make-vm-images-linux.sh build

      - name: QEMU Boot-Test Generated ISO (Required Gate, GCC)
        if: matrix.compiler == 'gcc'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 scripts/qemu-boot-image-linux.py build/artifacts/vibeos.iso BOOT_OK 180 cdrom raw

      # The disk the .vdi/.vmdk/.ova carry, booted as it ships: init has to
      # read the production manifest from the native root (E4-025: it was a
      # bare ESP with no root; E4-023: it ran the gate's self-test). The line
      # says one service and no malformed ones - the shell, nothing else.
      - name: QEMU Boot-Test the VirtualBox Disk Runs the Production Root (Required Gate, GCC)
        if: matrix.compiler == 'gcc'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 scripts/qemu-boot-image-linux.py build/artifacts/vibeos.vdi "NATIVE_INIT_MANIFEST file 1 0" 240 disk vdi

      - name: QEMU OVMF Summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f qemu-ovmf-summary.txt ]]; then
            cat qemu-ovmf-summary.txt
            status="$(grep '^status=' qemu-ovmf-summary.txt | cut -d= -f2- || true)"
            reason="$(grep '^reason=' qemu-ovmf-summary.txt | cut -d= -f2- || true)"
            profile="$(grep '^profile_used=' qemu-ovmf-summary.txt | cut -d= -f2- || true)"
            phase="$(grep '^last_boot_phase=' qemu-ovmf-summary.txt | cut -d= -f2- || true)"
            echo "OVMF status=${status} reason=${reason} profile=${profile} phase=${phase}"
          fi

      - name: QEMU Direct-Loader Probe (Informational)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-smoke-linux.sh
          ./scripts/qemu-smoke-linux.sh build

      - name: Upload Linux Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}-artifacts
          path: |
            build/artifacts/**
            build/artifacts/vibeos_esp.img
            build/artifacts/vibeos.vdi
            build/artifacts/vibeos.vmdk
            build/artifacts/vibeos.iso
            build/Testing/**/Test.xml
            qemu-serial-*.log
            qemu-err-*.log
            qemu-ovmf-serial-*.log
            qemu-ovmf-err-*.log
            qemu-ovmf-serial.log
            qemu-ovmf-err.log
            qemu-ovmf-summary.txt
            qemu-cli-serial.log
            qemu-cli-err.log
            qemu-cli-summary.txt
            qemu-smoke-summary.txt
          if-no-files-found: warn

  concurrency-production-sabotage:
    name: Production-path concurrency negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install guest and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ninja-build build-essential clang ovmf xorriso musl-tools busybox-static ntfs-3g exfatprogs mtools e2fsprogs gcc-mingw-w64-x86-64
      - name: Build guest and host test baseline
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVIBEOS_BUILD_TESTS=ON -DVIBEOS_BUILD_KERNEL_IMAGE=ON -DVIBEOS_REQUIRE_TLS=ON
          cmake --build build --parallel
          cmake --build build --target vibeos_image
      - name: Prove FD close/reuse fails when production fdget drops its reference
        env:
          SABOTAGE_VERIFY: bash scripts/dev/verify-concurrency-guest-sabotage.sh build blocked_read_did_not_survive_descriptor_reuse|blocked_read_fd_reuse_failed_in_a_seeded_round|file_put_underflow
        run: python3 scripts/dev/sabotage.py kernel/abi/linux/fs.c scripts/dev/cases/linux-fd-reference.txt build
      - name: Prove blocked read reports EFAULT when production pipe fault handling is removed
        env:
          SABOTAGE_VERIFY: bash scripts/dev/verify-concurrency-guest-sabotage.sh build blocked_read_unmap_did_not_return_efault|blocked_read_unmap_failed_in_a_seeded_round
        run: python3 scripts/dev/sabotage.py kernel/abi/files/pipefile.c scripts/dev/cases/linux-pipe-fault.txt build
      - name: Prove the QEMU gate rejects a missing replay seed
        env:
          SABOTAGE_VERIFY: bash scripts/dev/verify-concurrency-guest-sabotage.sh build blocked_read_race_seed_missing
        run: python3 scripts/dev/sabotage.py tests/linux/musl_threads.c scripts/dev/cases/linux-race-seed-marker.txt build
      - name: Prove the QEMU gate rejects a replay seed other than the one built
        env:
          VIBEOS_THREADS_EXPECTED_SEED: "0x200199"
          SABOTAGE_VERIFY: bash scripts/dev/verify-concurrency-guest-sabotage.sh build blocked_read_race_seed_mismatch
        run: python3 scripts/dev/sabotage.py tests/linux/musl_threads.c scripts/dev/cases/linux-race-seed-mismatch.txt build
      - name: Prove the QEMU gate requires the descriptor-reuse success marker
        env:
          SABOTAGE_VERIFY: bash scripts/dev/verify-concurrency-guest-sabotage.sh build blocked_read_did_not_survive_descriptor_reuse
        run: python3 scripts/dev/sabotage.py tests/linux/musl_threads.c scripts/dev/cases/linux-fd-reuse-marker.txt build
      - name: Prove TCP accept rejects a reused listener generation
        run: python3 scripts/dev/sabotage.py kernel/net/inet.c scripts/dev/cases/inet-parent-generation.txt build
      - name: Rebuild restored production tree
        run: cmake --build build --parallel

  windows-build-test:
    name: Windows Host Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run PowerShell Test Pipeline
        shell: pwsh
        run: |
          # Host tests only. The bootable image is a freestanding ELF for the
          # VibeOS target and its user programs assume LP64; building them with
          # a Windows-hosted toolchain produces something that could never run,
          # and only surfaces LLP64 noise. Linux builds and boot-gates the image.
          #
          # The TLS submodule is deliberately not fetched here: this job checks
          # the portable core, and the adapter builds and tests its
          # dependency-absent contract. Linux is the gate that requires TLS.
          ./scripts/run-tests.ps1 -BuildDir build -Generator Ninja -Profile ci -SkipImageBuild

      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-host-artifacts
          path: |
            artifacts/**
            build/artifacts/**
          if-no-files-found: warn

  parser-fuzz-build:
    name: Build and smoke parser fuzzers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 e2fsprogs gcc-mingw-w64-x86-64 \
            mtools exfatprogs ntfs-3g xorriso fdisk gdisk

      - name: Configure host tests for production sabotage verification
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DVIBEOS_BUILD_TESTS=ON -DVIBEOS_BUILD_KERNEL_IMAGE=OFF \
            -DVIBEOS_ENABLE_TLS=OFF
          cmake --build build --parallel --target vibeos_kernel_tests

      - name: Configure and build instrumented fuzzers
        run: |
          set -euo pipefail
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DVIBEOS_BUILD_FUZZERS=ON \
            -DVIBEOS_BUILD_TESTS=OFF \
            -DVIBEOS_BUILD_KERNEL_IMAGE=OFF \
            -DVIBEOS_ENABLE_TLS=OFF
          cmake --build build-fuzz --parallel --target fuzz_exec_images fuzz_ext2_image fuzz_fs_images

      - name: Verify sanitizer negative control
        run: python3 tests/fuzz/verify_sanitizer.py clang

      - name: Generate real-tool parser seed corpora
        run: python3 tests/fuzz/make_seed_corpus.py fuzz-corpus

      - name: Prove the ext4 bitmap guard with a production-source sabotage
        env:
          SABOTAGE_VERIFY: bash tests/fuzz/verify_ext4_bitmap_bound.sh build-fuzz
        run: python3 scripts/dev/sabotage.py kernel/fs/ext2.c scripts/dev/cases/ext4-bitmap-geometry.txt build

      - name: Show ext4 negative-control diagnostics
        if: always()
        run: |
          if [ -f ext4-bitmap-negative-control.log ]; then
            cat ext4-bitmap-negative-control.log
          else
            echo "No ext4 negative-control log was produced."
          fi

      - name: Prove the filesystem fuzzer finds a removed GPT bound by itself
        env:
          SABOTAGE_VERIFY: bash tests/fuzz/verify_fs_fuzzer_finds.sh build-fuzz 120
        run: python3 scripts/dev/sabotage.py kernel/fs/partition.c scripts/dev/cases/fuzz-gpt-header-size.txt build

      - name: Rebuild the restored production parsers
        run: cmake --build build-fuzz --parallel --target fuzz_ext2_image fuzz_fs_images

      - name: Smoke ELF/PE fuzzer
        run: ./build-fuzz/fuzz_exec_images fuzz-corpus/exec_images -max_total_time=20 -max_len=1048576

      - name: Smoke ext2 fuzzer
        run: ./build-fuzz/fuzz_ext2_image fuzz-corpus/ext2 fuzz-corpus/ext4 -max_total_time=20 -max_len=8388608

      - name: Smoke FAT/exFAT/NTFS/ISO9660/partition fuzzer
        run: ./build-fuzz/fuzz_fs_images fuzz-corpus/fs -max_total_time=20 -max_len=8388608
