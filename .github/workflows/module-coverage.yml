# SPDX-License-Identifier: GPL-3.0-or-later
name: Module Coverage Torture

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/core_sources.cmake"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/module-coverage.yml"
      - "kernel/abi/**"
      - "kernel/fs/blockcache.c"
      - "kernel/ipc/**"
      - "kernel/object/**"
      - "kernel/proc/**"
      - "kernel/txn/**"
      - "include/vibeos/**"
      - "tests/kernel/module_torture.c"
      - "scripts/dev/check-nightly-coverage.py"
      - "scripts/dev/check-sabotage-anchors.py"
      - "scripts/dev/sabotage.py"
      - "scripts/dev/cases/*-coverage.txt"
      - "scripts/dev/verify-module-*.sh"
      - "docs/implementation_progress.md"
      - "docs/implementation_progress/module_torture.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-coverage:
    name: Five module models and production mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure ASan and UBSan host build
        run: |
          set -euo pipefail
          cmake -S . -B build-module-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DVIBEOS_BUILD_TESTS=ON -DVIBEOS_BUILD_KERNEL_IMAGE=OFF \
            -DVIBEOS_ENABLE_TLS=OFF -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build host tests and module torture
        run: cmake --build build-module-asan --parallel
      - name: Run the five focused CTest entries
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --test-dir build-module-asan --output-on-failure -R "vibeos-module-.*-torture"
      - name: Require every production mutation to turn its model red
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: bash scripts/dev/verify-module-mutations.sh build-module-asan
