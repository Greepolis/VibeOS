<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VibeOS interaction states concept</title>
  <desc id="desc">A destructive confirmation dialog with keyboard focus, a non-modal notification, and a recoverable storage error card.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#071018" flood-opacity=".32"/></filter></defs>
  <rect width="1440" height="900" fill="#E7ECEF"/><text x="80" y="86" fill="#17232D" font-family="IBM Plex Sans, sans-serif" font-size="28" font-weight="600">Interaction states</text><text x="80" y="116" fill="#63727B" font-family="IBM Plex Sans, sans-serif" font-size="14">Focus is visible. Errors explain what happened and what the user can do next.</text>
  <rect x="68" y="154" width="1304" height="660" rx="18" fill="#202A38"/><path d="M68 520 490 154 820 814H68Z" fill="#2B3948" opacity=".58"/><path d="M1030 814 900 154h100l372 420v240Z" fill="#365260" opacity=".3"/>
  <rect x="68" y="154" width="1304" height="40" fill="#121820"/><rect x="86" y="163" width="22" height="22" rx="6" fill="#3A6EA5"/><path d="M91 180v-10l6-4 6 4v10" fill="none" stroke="#FFF" stroke-width="1.5"/><text x="118" y="180" fill="#FFF" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">VibeOS  /  Files</text><text x="1283" y="180" fill="#D8E0E5" font-family="IBM Plex Sans, sans-serif" font-size="12">09:41</text>
  <g filter="url(#shadow)" font-family="IBM Plex Sans, Noto Sans, sans-serif">
    <rect x="392" y="331" width="656" height="310" rx="12" fill="#F2F4F5"/><path d="M404 331h632a12 12 0 0 1 12 12v32H392v-32a12 12 0 0 1 12-12Z" fill="#344655"/><text x="424" y="361" fill="#FFF" font-size="13" font-weight="600">Confirm action</text><rect x="1008" y="344" width="22" height="22" rx="6" fill="#526674"/><path d="m1015 351 8 8m0-8-8 8" stroke="#FFF" stroke-width="1.4"/>
    <circle cx="442" cy="422" r="22" fill="#F7E8E8"/><path d="M442 408v17m0 7v1" stroke="#A42932" stroke-width="3" stroke-linecap="round"/><text x="480" y="418" fill="#17232D" font-size="20" font-weight="600">Move 4 items to Trash?</text><text x="480" y="448" fill="#596971" font-size="13">You can restore them from Trash until it is emptied.</text><text x="480" y="472" fill="#596971" font-size="13">This will not delete files from the read-only System volume.</text>
    <rect x="424" y="510" width="592" height="1" fill="#D4DCE0"/><text x="424" y="548" fill="#7A878E" font-size="11">Enter confirms  -  Esc cancels</text>
    <rect x="706" y="570" width="132" height="42" rx="8" fill="#FFF" stroke="#AEBBC2"/><text x="772" y="596" text-anchor="middle" fill="#34434C" font-size="13" font-weight="600">Cancel</text>
    <rect x="850" y="566" width="166" height="50" rx="10" fill="none" stroke="#F3B33D" stroke-width="3"/><rect x="854" y="570" width="158" height="42" rx="8" fill="#A42932"/><text x="933" y="596" text-anchor="middle" fill="#FFF" font-size="13" font-weight="600">Move to Trash</text>
  </g>
  <text x="390" y="674" fill="#CBD5DB" font-family="IBM Plex Sans, sans-serif" font-size="12">Scoped modal: only the parent window is blocked</text>
  <g filter="url(#shadow)" font-family="IBM Plex Sans, Noto Sans, sans-serif">
    <rect x="942" y="220" width="360" height="120" rx="12" fill="#F2F4F5"/><rect x="942" y="220" width="5" height="120" rx="2" fill="#3A6EA5"/><rect x="962" y="239" width="32" height="32" rx="8" fill="#DDEAF2"/><path d="M970 255h16m-13-5 5-4 5 4m-13 10h16" fill="none" stroke="#3A6EA5" stroke-width="1.6"/><text x="1006" y="250" fill="#17232D" font-size="13" font-weight="600">System update ready</text><text x="1006" y="273" fill="#5E6C74" font-size="11">A verified update can be installed</text><text x="1006" y="290" fill="#5E6C74" font-size="11">when you are ready.</text><text x="962" y="322" fill="#3A6EA5" font-size="11" font-weight="600">Review update  &gt;</text><path d="m1274 238 9 9m0-9-9 9" stroke="#718087" stroke-width="1.3"/>
  </g>
  <g filter="url(#shadow)" font-family="IBM Plex Sans, Noto Sans, sans-serif">
    <rect x="932" y="690" width="370" height="92" rx="12" fill="#F2F4F5"/><circle cx="958" cy="718" r="11" fill="#F7E8E8"/><path d="M958 711v8m0 4v1" stroke="#A42932" stroke-width="2" stroke-linecap="round"/><text x="980" y="718" fill="#17232D" font-size="12" font-weight="600">Could not copy this file</text><text x="980" y="739" fill="#5E6C74" font-size="11">The destination is read-only.</text><text x="980" y="762" fill="#3A6EA5" font-size="11" font-weight="600">Choose another location  &gt;</text>
  </g>
</svg>
