  <g font-family="IBM Plex Sans, Noto Sans, sans-serif"><rect width="1440" height="40" fill="#121820"/><rect x="15" y="8" width="24" height="24" rx="7" fill="#3A6EA5"/><path d="M21 25V15l6-4 6 4v10h-4v-6h-4v6Z" fill="#FFF"/><text x="48" y="26" fill="#FFF" font-size="14" font-weight="600">VibeOS</text><text x="124" y="26" fill="#D8E0E5" font-size="13">Desktop</text><rect x="615" y="6" width="120" height="28" rx="8" fill="#283643" stroke="#486274"/><circle cx="631" cy="20" r="4" fill="#F3B33D"/><text x="643" y="25" fill="#FFF" font-size="12" font-weight="600">01 Workbench</text><rect x="1277" y="8" width="32" height="24" rx="6" fill="#283643"/><path d="M1284 23h17m-14-7 6-4 6 4" fill="none" stroke="#FFF" stroke-width="1.4"/><text x="1383" y="25" fill="#FFF" font-size="12">09:41</text></g>
  <text x="44" y="836" fill="#C4D0D7" font-family="IBM Plex Sans, sans-serif" font-size="13">Desktop  -  press Super to close the launcher</text>
