<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VibeOS launcher and quick settings concept</title>
  <desc id="desc">A searchable application launcher centered over the desktop, plus a separate quick settings popover below the status panel.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#071018" flood-opacity=".42"/></filter></defs>
