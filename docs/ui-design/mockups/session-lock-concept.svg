<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VibeOS session lock visual concept</title>
  <desc id="desc">A proposed session-lock screen with large time, account identity and unlock panel. It is a nonfunctional concept pending authentication design.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202A38"/><stop offset="1" stop-color="#314C59"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="24" flood-color="#071018" flood-opacity=".32"/></filter></defs>
  <rect width="1440" height="900" fill="url(#sky)"/><path d="M0 600 420 290l330 610H0Z" fill="#405C64" opacity=".65"/><path d="M500 900 880 0h160L1440 610v290Z" fill="#688078" opacity=".24"/><circle cx="1130" cy="200" r="170" fill="#F3B33D" opacity=".08"/><path d="M100 770 870 130" stroke="#D3E0E3" stroke-width="1" opacity=".12"/>
  <text x="80" y="74" fill="#EAF0F2" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600">VibeOS</text><text x="80" y="276" fill="#FFF" font-family="IBM Plex Sans, sans-serif" font-size="84" font-weight="300">09:41</text><text x="86" y="316" fill="#CFD9DE" font-family="IBM Plex Sans, sans-serif" font-size="19">Saturday, October 17</text><text x="86" y="372" fill="#CFD9DE" font-family="IBM Plex Sans, sans-serif" font-size="13">Workbench is locked</text>
  <g filter="url(#shadow)" font-family="IBM Plex Sans, Noto Sans, sans-serif">
    <rect x="848" y="240" width="430" height="420" rx="18" fill="#F2F4F5"/><circle cx="1063" cy="324" r="40" fill="#D7E5EE"/><circle cx="1063" cy="313" r="14" fill="#3A6EA5"/><path d="M1038 348c3-18 17-27 25-27s22 9 25 27" fill="#3A6EA5"/>
    <text x="1063" y="393" text-anchor="middle" fill="#17232D" font-size="20" font-weight="600">User</text><text x="1063" y="416" text-anchor="middle" fill="#6E7B82" font-size="12">Session locked</text>
    <text x="898" y="464" fill="#34434C" font-size="12" font-weight="600">Password</text><rect x="898" y="478" width="330" height="46" rx="8" fill="#FFF" stroke="#86A9BF" stroke-width="2"/><text x="918" y="507" fill="#87949B" font-size="13">Enter password</text><rect x="1190" y="488" width="26" height="26" rx="6" fill="#E7ECEF"/><path d="M1197 501h12m-4-4 4 4-4 4" fill="none" stroke="#61717B" stroke-width="1.4"/>
    <text x="898" y="550" fill="#687780" font-size="11">Your apps remain private while the session is locked.</text><rect x="898" y="577" width="330" height="44" rx="8" fill="#3A6EA5"/><text x="1063" y="604" text-anchor="middle" fill="#FFF" font-size="13" font-weight="600">Unlock session</text>
  </g>
  <text x="720" y="850" text-anchor="middle" fill="#F3D78E" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600">CONCEPT ONLY - NOT A SECURITY FEATURE UNTIL AUTHENTICATION AND TRUSTED UNLOCK ARE IMPLEMENTED</text>
</svg>
